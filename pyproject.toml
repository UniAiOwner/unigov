[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unigov"
version = "0.7.1"
description = "UniGov: Sovereign Autonomous Project Governance Engine & Deterministic State Machine"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "textual>=0.80.0",
    "pydantic>=2.7.0",
    "google-genai>=1.0.0",
    "pytest>=8.0.0"
]

[project.scripts]
unigov = "unigov.cli:app"
antigravity-pm = "unigov.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
