[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-pm"
version = "0.4.0"
description = "Deterministic State Machine + AI Project Manager CLI for Antigravity"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "textual>=0.80.0",
    "pydantic>=2.7.0",
    "google-genai>=1.0.0",
    "pytest>=8.0.0"
]

[project.scripts]
antigravity-pm = "antigravity_pm.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
